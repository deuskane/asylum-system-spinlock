name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
jobs:
#<GENERATE_BEGIN>
  sim_spinlock:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_spinlock

  sim_spinlock_acquire_release:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_spinlock_acquire_release

  sim_spinlock_async_reset:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_spinlock_async_reset

  sim_spinlock_independent:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_spinlock_independent

  sim_spinlock_owner:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_spinlock_owner

  sim_spinlock_reset_values:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_spinlock_reset_values

  sim_spinlock_write_values:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_spinlock_write_values

  lint_ghdl:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl

  lint_ghdl_synth_default:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl_synth_default

  lint_ghdl_synth_owner:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl_synth_owner

  syn_default:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: syn_default

  syn_owner:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: syn_owner

  badges:
    needs: [sim_spinlock, sim_spinlock_acquire_release, sim_spinlock_async_reset, sim_spinlock_independent, sim_spinlock_owner, sim_spinlock_reset_values, sim_spinlock_write_values, lint_ghdl, lint_ghdl_synth_default, lint_ghdl_synth_owner, syn_default, syn_owner]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: deuskane/asylum-ci/.github/workflows/badges.yml@main
    with:
      results: ${{ toJSON(needs) }}

#<GENERATE_END>
